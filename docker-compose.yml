services:
  alx:
    # 国内线上默认从腾讯云 CCR 拉取；本地源码开发可执行 docker compose up -d --build。
    image: ${ALX_IMAGE:-ccr.ccs.tencentyun.com/ningmengchongshui/alemonx:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${alx_VERSION:-dev}
    container_name: alx
    restart: unless-stopped
    init: true
    ports:
      # 默认只允许宿主机访问；线上请交给 HTTPS 反向代理，或显式设置 0.0.0.0。
      - "${alx_LISTEN_ADDRESS:-127.0.0.1}:${alx_PORT:-17390}:17390"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 程序使用 ALBS_BIND；容器内监听全部地址，外部暴露范围由 ports 控制。
      ALBS_BIND: 0.0.0.0
      PORT: 17390
      # 容器内工作台只管理该目录，避免访问容器其它路径。
      ALEMONJS_SETUP_ROOTS: /workspace/robots
      HOME: /home/alx
      XDG_CONFIG_HOME: /home/alx/.config
    volumes:
      # 每个环境各自持久化：本地可开发，线上可持续管理其机器人。
      - ./workspace:/workspace
      - ./state:/home/alx/.config
      # SSH 管理会在此创建或读取部署专用密钥；不要挂载个人完整 ~/.ssh。
      - ${alx_SSH_DIR:-./ssh}:/home/alx/.ssh
