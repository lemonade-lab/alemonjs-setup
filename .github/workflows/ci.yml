name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - run: yarn lint && yarn build
        working-directory: frontend
      - run: go test ./internal/... && go vet ./internal/... && go build -o /tmp/alemonjs-setup .

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, filename: alemonjs-setup-windows-amd64.exe }
          - { goos: darwin, goarch: arm64, filename: alemonjs-setup-darwin-arm64 }
          - { goos: darwin, goarch: amd64, filename: alemonjs-setup-darwin-amd64 }
          - { goos: linux, goarch: amd64, filename: alemonjs-setup-linux-amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21.x'
      - run: yarn install --frozen-lockfile && yarn build
        working-directory: frontend
      - run: mkdir -p release && CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o "release/${{ matrix.filename }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: release/${{ matrix.filename }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
